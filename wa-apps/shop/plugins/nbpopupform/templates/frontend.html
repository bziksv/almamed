<input type="submit" class="nb-open-form" value="{$form.name}" />

<script type="text/javascript" src="{$wa_active_theme_url}jquery.maskinput.js"></script>

<div class="nb-popup-form">

    <div class="h2">{$form.name}</div>
    {foreach $fields as $key => $field}
    <div class="nb-field">
        {if $field.type == "textarea"}
            <label>{$field.names}{if $field.required}<span class="nb-required" aria-hidden="true"> *</span>{/if}</label>
            <textarea name="{$field.names}" {if $field.required}data-required="1"{/if}></textarea>
        {elseif $field.type == "checkbox"}
            <label class="nb-consent">
                <input type="checkbox" name="{$field.names}" value="1" {if $field.required}data-required="1"{/if} autocomplete="off">
                <span class="nb-consent__text">Нажимая на эту кнопку, я даю <a target="_blank" rel="noopener" href="/pravovye-dokumenty-almamed/soglasie-na-obrabotku-pd/">согласие на обработку персональных данных</a> и соглашаюсь с условиями <a target="_blank" rel="noopener" href="/pravovye-dokumenty-almamed/politika-personalnyh-dannyh/">политики обработки персональных данных</a>.</span>
            </label>
        {else}
            <label>{$field.names}{if $field.required}<span class="nb-required" aria-hidden="true"> *</span>{/if}</label>
            <input type="{$field.type}" {if $key == 1}id="phone-mask"{/if} name="{$field.names}" {if $field.required}data-required="1"{/if}>
        {/if}
    </div>
    {/foreach}


</div>


<script type="text/javascript" src="{$wa_url}wa-content/js/jquery-wa/wa.dialog.js"></script>
<style>
    .nb-popup-form{
        display: none;
    }
    .nb-popup-form h2{
        text-align: center;
    }

    .nb-popup-form .nb-field{
        margin-bottom: 20px;
    }

    .nb-popup-form label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        line-height: 1.35;
        color: #333;
    }

    .nb-popup-form .nb-required {
        color: #e53935;
        font-weight: 600;
    }

    .nb-popup-form .nb-consent {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: 0;
        cursor: pointer;
    }

    .nb-popup-form .nb-consent input[type="checkbox"] {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        margin: 2px 0 0;
        cursor: pointer;
    }

    /* profitbuy.stylizeInput + flex: без этого .at-stylize-box сжимается в полоску */
    .nb-popup-form .nb-consent .at-stylize-box {
        flex: 0 0 20px;
        width: 20px !important;
        height: 20px !important;
        min-width: 20px;
        min-height: 20px;
        margin: 2px 0 0 !important;
    }

    .nb-popup-form .nb-consent__text {
        font-size: 12px;
        line-height: 1.45;
        color: #555;
    }

    .nb-popup-form .nb-consent__text a {
        color: #0497C0;
        text-decoration: underline;
        text-underline-offset: 2px;
    }

    .nb-popup-form input[type="text"],
    .nb-popup-form textarea {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d5dce3;
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 14px;
        line-height: 1.4;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .nb-popup-form input[type="text"]:focus,
    .nb-popup-form textarea:focus {
        outline: none;
        border-color: #0497C0;
        box-shadow: 0 0 0 3px rgba(4, 151, 192, 0.15);
    }

    .nb-popup-form .nb-field.nb-field--error input[type="text"],
    .nb-popup-form .nb-field.nb-field--error textarea {
        border-color: #e53935;
        box-shadow: 0 0 0 3px rgba(229, 57, 53, 0.12);
    }

    .nb-popup-form .nb-field.nb-field--error .nb-consent__text {
        color: #444;
    }

    .nb-popup-form .nb-error-msg {
        display: block;
        margin-top: 6px;
        font-size: 12px;
        line-height: 1.35;
        color: #c62828;
    }

    .dialog.nb-kp-dialog .dialog-buttons input[type="submit"]:disabled {
        opacity: 0.55;
        cursor: not-allowed;
    }

    .nb-popup-form textarea{
        height: 100px;
    }

    .dialog-buttons-gradient{
        text-align: center;
    }

    /* Не трогаем глобальный .dialog-window — в теме он full-screen под корзину */

    .dialog.nb-kp-dialog {
        position: fixed;
        inset: 0;
        z-index: 10050;
        align-items: center;
        justify-content: center;
        padding: 12px;
        box-sizing: border-box;
    }

    .dialog.nb-kp-dialog[style*="display: block"],
    .dialog.nb-kp-dialog:not([style*="display: none"]) {
        display: flex !important;
    }

    .dialog.nb-kp-dialog .dialog-background {
        z-index: 1;
    }

    .dialog.nb-kp-dialog .dialog-window {
        position: relative !important;
        top: auto !important;
        left: auto !important;
        right: auto !important;
        bottom: auto !important;
        z-index: 2;
        width: 100% !important;
        max-width: 400px;
        min-width: 0 !important;
        max-height: min(85vh, 640px);
        height: auto !important;
        min-height: 0 !important;
        overflow: auto;
        -webkit-overflow-scrolling: touch;
        margin: 0;
        background: #fff;
        padding: 20px 24px 0;
        border: 5px solid #f3f3f3;
        box-shadow: 0 0 70px #bbb;
        border-radius: 15px;
        box-sizing: border-box;
    }

    .dialog.nb-kp-dialog .dialog-content-indent {
        padding-bottom: 8px;
    }

    .dialog.nb-kp-dialog .dialog-buttons-gradient {
        text-align: center;
        padding: 12px 0 16px;
    }

    .nb-open-form{
        color: #fff;
        background-color: #19A5CC!important;
        width: 287px;
        margin: 15px 0;
        height: 50px!important;
        line-height: 50px!important;
    }

    @media only screen and (max-width:601px){
        .nb-open-form{
            width: 100%;
            height: 3rem!important;
            line-height: 3rem!important;
        }

        .dialog.nb-kp-dialog {
            padding: 8px;
        }

        .dialog.nb-kp-dialog .dialog-window {
            max-width: none;
            border-radius: 12px;
            padding: 16px 16px 0;
        }
    }

</style>

<script>
    $(function(){

        /* waDialog вешает overlay на parent — иначе форма оказывается в колонке корзины (~350px) */
        $('.nb-popup-form').appendTo('body');

        function clearNbFieldError($field) {
            $field.removeClass('nb-field--error').find('.nb-error-msg').remove();
        }

        function setNbFieldError($field, message) {
            $field.addClass('nb-field--error');
            if (!$field.find('.nb-error-msg').length) {
                $('<span class="nb-error-msg"></span>').text(message).appendTo($field);
            }
        }

        function validateNbPopupForm($dialog) {
            var valid = true;
            var $firstError = null;

            $dialog.find('.nb-field').each(function() {
                clearNbFieldError($(this));
            });

            $dialog.find('[data-required="1"]').each(function() {
                var $input = $(this);
                var $field = $input.closest('.nb-field');

                if ($input.is(':checkbox')) {
                    if (!$input.prop('checked')) {
                        valid = false;
                        setNbFieldError($field, 'Подтвердите согласие на обработку персональных данных');
                        $firstError = $firstError || $field;
                    }
                    return;
                }

                if (!$.trim($input.val())) {
                    valid = false;
                    setNbFieldError($field, 'Заполните это поле');
                    $firstError = $firstError || $field;
                }
            });

            if ($firstError && $firstError.length) {
                var dialogWindow = $dialog.find('.dialog-window').get(0);
                if (dialogWindow) {
                    var top = $firstError.position().top + dialogWindow.scrollTop - 12;
                    dialogWindow.scrollTop = Math.max(0, top);
                }
            }

            return valid;
        }

        function initNbKpDialog($dialog) {
            var $submit = $dialog.find('.dialog-buttons input[type="submit"]');
            var $checkbox = $dialog.find('.nb-popup-form input[type="checkbox"]');

            $dialog.find('form').attr('novalidate', 'novalidate');
            $checkbox.prop('checked', false);
            $submit.prop('disabled', true);

            $checkbox.off('change.nbKp').on('change.nbKp', function() {
                $submit.prop('disabled', !$(this).prop('checked'));
                if ($(this).prop('checked')) {
                    clearNbFieldError($(this).closest('.nb-field'));
                }
            });

            $dialog.off('input.nbKp change.nbKp', '.nb-popup-form input, .nb-popup-form textarea')
                .on('input.nbKp change.nbKp', '.nb-popup-form input, .nb-popup-form textarea', function() {
                    var $field = $(this).closest('.nb-field');
                    if ($(this).is(':checkbox') || $.trim($(this).val())) {
                        clearNbFieldError($field);
                    }
                });

            var $phone = $dialog.find('#phone-mask');
            if ($phone.length && $.fn.mask) {
                $phone.mask('+7 (999) 999-9999');
            }
        }

        $('.nb-open-form').click(function(){
            var id = $('[id^="cart-form"]').attr('data-id');
            $('.nb-popup-form').waDialog({
                'class': 'nb-kp-dialog',
                'buttons': '<input type="submit" value="Отправить" style="width: 200px; max-width: 100%;" disabled="disabled"/>',
                'width': '400px',
                onLoad: function() {
                    initNbKpDialog($(this));
                },
                onSubmit : function(a){
                    var $dialog = $(this);
                    if (!validateNbPopupForm($dialog)) {
                        return false;
                    }

                    var data = {
                        id : id,
                        data : $dialog.find('form').serializeArray()
                    };
                    $.post('/nbpopupform/send/',data,function(data){

                        if(data.data.response){
                            yaCounter34079080.reachGoal('Zapros_KP_na_tovare_20220101',false,goalCallback);
                            a.trigger('close');
                            $('<div><form>' +
                                '<div class="dialog-content" style="text-align: center;margin-bottom: 20px">Спасибо за обращение, Ваша заявка в обработке. Мы обрабатываем заявки по очередности, средний срок обработки от часа до  1 рабочего дня.</div>' +
                                    '<div class="dialog-buttons" style="text-align: center">' +
                                        '<input type="submit" value="Закрыть" style="width: 200px;"/>' +
                                    '</form></div>' +
                            '</div>').waDialog({
                                'class': 'nb-kp-dialog',
                                'onSubmit': function (d) {
                                    d.trigger('close');
                                    return false;
                                },
                                'width': '300px',
                            });
                        }else{
                            alert("Ошибка отправки!");
                        }
                    },"json");
                    return false;
                }
            });
            return false;
        });

        $('body').on('click','.dialog-background',function(){
            $('.dialog-window').trigger('close');
        });

    });

    function goalCallback () {
        console.log('запрос в Метрику успешно отправлен');
    }
</script>
