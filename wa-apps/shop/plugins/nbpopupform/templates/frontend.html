<input type="submit" class="nb-open-form" value="{$form.name}" />

<script type="text/javascript" src="{$wa_active_theme_url}jquery.maskinput.js"></script>

<div class="nb-popup-form">

    <div class="h2">{$form.name}</div>
    {foreach $fields as $key => $field}
    <div class="nb-field">
        {if $field.type == "textarea"}
            <label>{$field.names}</label>
            <textarea name="{$field.names}" {if $field.required}required{/if}></textarea>
        {elseif $field.type == "checkbox"}
            <input type="{$field.type}" name="{$field.names}" checked {if $field.required}required{/if}>
            <span>Нажимая на эту кнопку, я даю согласие на обработку своих персональных данных в соответствии с условиями <a target="_blank" href="/rules/politics-almamed.jpg">политики конфиденциальности</a>.</span>
        {else}
            <label>{$field.names}</label>
            <input type="{$field.type}" {if $key == 1}id="phone-mask"{/if} name="{$field.names}" {if $field.required}required{/if}>
        {/if}
    </div>
    {/foreach}


</div>


<script type="text/javascript" src="{$wa_url}wa-content/js/jquery-wa/wa.dialog.js"></script>
<style>
    .nb-popup-form{
        display: none;
    }
    .nb-popup-form h2{
        text-align: center;
    }

    .nb-popup-form .nb-field{
        margin-bottom: 20px;
    }

    .nb-popup-form input[type="text"],
    .nb-popup-form textarea
    {
        width: 100%;
    }

    .nb-popup-form textarea{
        height: 100px;
    }

    .dialog-buttons-gradient{
        text-align: center;
    }

    .dialog-window{
        background: #FFF;
        padding: 20px 50px;
        overflow: auto;
        border: 5px solid #f3f3f3;
        box-shadow: 0px 0px 70px #bbb;
        border-radius: 15px;
    }

    .nb-open-form{
        color: #fff;
        background-color: #19A5CC!important;
        width: 287px;
        margin: 15px 0;
        height: 50px!important;
        line-height: 50px!important;
    }

    @media only screen and (max-width:601px){
        .nb-open-form{
            width: 100%;
            height: 3rem!important;
            line-height: 3rem!important;
        }

    }

</style>

<script>
    $(function(){

        $('#phone-mask').mask('+7 (999) 999-9999');

        var width = $(window).width();
        var left = "";
        if(width < 420){
            width = "250px";
            left = "0%"
        }else{
            width = "400px";
        }



        $('.nb-open-form').click(function(){
            var id = $('[id^="cart-form"]').attr('data-id');
            $('.nb-popup-form').waDialog({
                'buttons': '<input type="submit" value="Отправить" style="width: 200px;"/>',
                'width': width,
                'height':'80%',
                'offsetLeft':left,
                onSubmit : function(a){
                    var data = {
                        id : id,
                        data : $(this).serializeArray()
                    };
                    $.post('/nbpopupform/send/',data,function(data){

                        if(data.data.response){
                            yaCounter34079080.reachGoal('Zapros_KP_na_tovare_20220101',false,goalCallback);
                            a.trigger('close');
                            $('<div><form>' +
                                '<div class="dialog-content" style="text-align: center;margin-bottom: 20px">Спасибо за обращение, Ваша заявка в обработке. Мы обрабатываем заявки по очередности, средний срок обработки от часа до  1 рабочего дня.</div>' +
                                    '<div class="dialog-buttons" style="text-align: center">' +
                                        '<input type="submit" value="Закрыть" style="width: 200px;"/>' +
                                    '</form></div>' +
                            '</div>').waDialog({
                                'onSubmit': function (d) {
                                    d.trigger('close');
                                    return false;
                                },
                                'width': '300px',
                                'height':'150px',
                            });
                        }else{
                            alert("Ошибка отправки!");
                        }
                    },"json");
                    return false;
                }
            });
            return false;
        });

        $('body').on('click','.dialog-background',function(){
            $('.dialog-window').trigger('close');
        });

    });

    function goalCallback () {
        console.log('запрос в Метрику успешно отправлен');
    }
</script>
