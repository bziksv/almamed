<link href="/wa-apps/shop/plugins/slider/css/lightslider.css?v1.3.2" rel="stylesheet" type="text/css" media="print" onload="this.media='all'">
<noscript><link href="/wa-apps/shop/plugins/slider/css/lightslider.css?v1.3.2" rel="stylesheet" type="text/css"></noscript>

<style>
    .header-slider-wrap {
        padding: 0 0.75rem;
        overflow: hidden;
        position: relative;
    }
    .header-slider {
        text-align: center;
        overflow: hidden;
        max-width: 100%;
        aspect-ratio: 1300 / 220;
        max-height: 220px;
        contain: layout style;
    }
    .header-slider .lSSlideOuter,
    .header-slider .lSSlideWrapper {
        max-width: 100%;
        margin: 0 auto;
        overflow: hidden !important;
        height: 100% !important;
    }
    .header-slider img {
        width: 100%;
        max-width: 100%;
        height: 100%;
        vertical-align: middle;
        display: block;
        margin: 0 auto;
        object-fit: contain;
    }
    @media (max-width: 1200px) {
        .header-slider {
            aspect-ratio: 992 / 660;
            max-height: 420px;
        }
    }
    @media (max-width: 480px) {
        .header-slider {
            aspect-ratio: 576 / 870;
            max-height: 420px;
        }
    }
    #slider-head,
    #slider-head > li {
        list-style: none !important;
        margin: 0;
        padding: 0;
    }
    #slider-head:not(.slider-ready) {
        margin: 0;
        padding: 0;
        overflow: hidden;
    }
    #slider-head:not(.slider-ready) > li:not(:first-child),
    .header-slider-wrap:not(.slider-ready) #slider-head li:nth-child(n+2) {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        overflow: hidden !important;
        margin: 0 !important;
        padding: 0 !important;
    }
    #slider-head:not(.slider-ready) > li:first-child,
    .header-slider-wrap:not(.slider-ready) #slider-head li:first-child {
        display: block !important;
        visibility: visible !important;
        width: 100%;
    }
    @media only screen and (max-width: 800px) {
        .header-slider-wrap {
            padding-left: 0;
            padding-right: 0;
        }
    }
</style>

<script type="text/javascript" src="/wa-apps/shop/plugins/slider/js/lightslider.js?v1.3.2" defer data-script-exception="1"></script>

<div class="header-slider">
    <ul id="slider-head">
        {foreach $slides as $s name=slider_slides}
            <li data-slide-id="{$s.id|escape}">
                <a href="{$s.link|escape}" class="slider-slide-link" data-slide-id="{$s.id|escape}">
                    <img{if $smarty.foreach.slider_slides.first} src="{$s.img|escape}" fetchpriority="high" decoding="async"{else} src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1300 220'%3E%3C/svg%3E" loading="lazy"{/if}
                         alt="{$s.alt|escape}"
                         width="1300"
                         height="220"
                         data-desktop-src="{$s.img|escape}"
                         data-tablet-src="{$s.img_tablet|escape}"
                         data-mobile-src="{$s.img_mobile|escape}"
                         data-lazy-slide="{if $smarty.foreach.slider_slides.first}0{else}1{/if}">
                </a>
            </li>
        {/foreach}
    </ul>
</div>

<script>
    (function() {
        var wrap = document.querySelector('.header-slider-wrap');
        var ul = document.getElementById('slider-head');
        if (!ul) {
            return;
        }
        if (wrap) {
            wrap.classList.remove('slider-ready');
        }
        var items = ul.children;
        for (var i = 1; i < items.length; i++) {
            items[i].style.display = 'none';
        }
    })();
</script>

<script>
    (function() {
        var TABLET_BREAKPOINT = 1200;
        var MOBILE_BREAKPOINT = 480;
        var slider = document.getElementById('slider-head');
        if (!slider) {
            return;
        }

        function pickSrc(img) {
            var width = window.innerWidth || document.documentElement.clientWidth;
            var src = img.getAttribute('data-desktop-src');
            if (width <= MOBILE_BREAKPOINT && img.getAttribute('data-mobile-src')) {
                src = img.getAttribute('data-mobile-src');
            } else if (width <= TABLET_BREAKPOINT && img.getAttribute('data-tablet-src')) {
                src = img.getAttribute('data-tablet-src');
            }
            return src;
        }

        function ensureSlideSrc(img) {
            if (!img || img.getAttribute('data-lazy-slide') !== '1') {
                return;
            }
            var src = pickSrc(img);
            if (src && img.getAttribute('src') !== src) {
                img.setAttribute('src', src);
                img.setAttribute('data-lazy-slide', '0');
            }
        }

        var imgs = slider.getElementsByTagName('img');
        for (var i = 0; i < imgs.length; i++) {
            var img = imgs[i];
            if (img.getAttribute('data-lazy-slide') === '1') {
                continue;
            }
            var src = pickSrc(img);
            if (src) {
                img.setAttribute('src', src);
            }
        }

        window.almamedSliderEnsureSrc = ensureSlideSrc;
    })();
</script>

<script>
    jQuery(function($) {
        var TABLET_BREAKPOINT = 1200;
        var MOBILE_BREAKPOINT = 480;
        var STAT_URL = {$stat_url};
        var $slider = $('#slider-head');
        if (!$slider.length || !$.fn.lightSlider) {
            return;
        }

        var trackedViews = {};
        var activeBucket = null;
        var resizeTimer = null;
        var rebuilding = false;

        function getBreakpointBucket(width) {
            if (width <= MOBILE_BREAKPOINT) {
                return 'mobile';
            }
            if (width <= TABLET_BREAKPOINT) {
                return 'tablet';
            }
            return 'desktop';
        }

        function sendStat(slideId, type) {
            if (!STAT_URL || !slideId) {
                return;
            }
            $.ajax({
                url: STAT_URL,
                type: 'POST',
                data: { id: slideId, type: type },
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
        }

        function trackView(slideId) {
            slideId = parseInt(slideId, 10);
            if (!slideId || trackedViews[slideId]) {
                return;
            }
            trackedViews[slideId] = true;
            sendStat(slideId, 'view');
        }

        function getActiveSlideId() {
            var $active = $slider.find('li.active').first();
            if (!$active.length) {
                $active = $slider.children('li').first();
            }
            return $active.data('slide-id');
        }

        function preloadVisibleSlides() {
            $slider.find('li.active img, li.lslide.active img').each(function() {
                if (window.almamedSliderEnsureSrc) {
                    window.almamedSliderEnsureSrc(this);
                }
            });
            $slider.children('li').first().find('img').each(function() {
                if (window.almamedSliderEnsureSrc) {
                    window.almamedSliderEnsureSrc(this);
                }
            });
        }

        $slider.on('click', '.slider-slide-link', function() {
            sendStat($(this).data('slide-id'), 'click');
        });

        function pickSrc($img) {
            var width = window.innerWidth || document.documentElement.clientWidth;
            var src = $img.data('desktop-src');
            if (width <= MOBILE_BREAKPOINT && $img.data('mobile-src')) {
                src = $img.data('mobile-src');
            } else if (width <= TABLET_BREAKPOINT && $img.data('tablet-src')) {
                src = $img.data('tablet-src');
            }
            return src;
        }

        function applyResponsiveSrc() {
            $slider.find('img').each(function() {
                var $img = $(this);
                if ($img.data('lazy-slide') === 1 && window.almamedSliderEnsureSrc) {
                    return;
                }
                var src = pickSrc($img);
                if (src && $img.attr('src') !== src) {
                    $img.attr('src', src);
                }
            });
        }

        function whenAllImagesReady() {
            var waits = [];
            $slider.find('img').each(function() {
                var deferred = $.Deferred();
                var img = this;
                if (img.complete && img.naturalWidth) {
                    deferred.resolve();
                } else {
                    $(img).one('load error', function() {
                        deferred.resolve();
                    });
                }
                waits.push(deferred.promise());
            });
            return waits.length ? $.when.apply($, waits) : $.when();
        }

        function sliderOptions(width) {
            var bucket = getBreakpointBucket(width);

            return {
                item: 1,
                slideMove: 1,
                pause: 5000,
                controls: false,
                loop: $slider.children('li').length > 1,
                auto: $slider.children('li').length > 1,
                enableDrag: bucket !== 'desktop',
                easing: 'cubic-bezier(0.25, 0, 0.25, 1)',
                speed: 600,
                adaptiveHeight: false,
                slideMargin: bucket === 'desktop' ? 0 : 6,
                onBeforeSlide: function() {
                    preloadVisibleSlides();
                },
                onAfterSlide: function() {
                    preloadVisibleSlides();
                    trackView(getActiveSlideId());
                }
            };
        }

        function destroySlider() {
            if ($slider.hasClass('lightSlider') && typeof $slider.destroy === 'function') {
                try {
                    $slider.destroy();
                } catch (e) {}
            }
            $slider.removeClass('slider-ready lightSlider lSSlide');
            $('.header-slider-wrap').removeClass('slider-ready');
        }

        function initSlider() {
            destroySlider();
            var width = window.innerWidth || document.documentElement.clientWidth;
            activeBucket = getBreakpointBucket(width);

            if ($slider.children('li').length < 1) {
                return;
            }

            preloadVisibleSlides();

            try {
                $slider.lightSlider(sliderOptions(width));
                $slider.addClass('slider-ready');
                $('.header-slider-wrap').addClass('slider-ready');
                trackView(getActiveSlideId());
            } catch (e) {
                $slider.removeClass('slider-ready');
                $('.header-slider-wrap').removeClass('slider-ready');
            }
        }

        function rebuildSlider(force) {
            if (rebuilding) {
                return;
            }

            var width = window.innerWidth || document.documentElement.clientWidth;
            var bucket = getBreakpointBucket(width);
            if (!force && bucket === activeBucket && $slider.hasClass('slider-ready')) {
                return;
            }

            rebuilding = true;
            applyResponsiveSrc();
            whenAllImagesReady().always(function() {
                initSlider();
                rebuilding = false;
            });
        }

        rebuildSlider(true);

        $(window).on('resize orientationchange', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                rebuildSlider(false);
            }, 250);
        });
    });
</script>
