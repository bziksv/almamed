<link href="/wa-apps/shop/plugins/slider/css/lightslider.css?v1.3.4" rel="stylesheet" type="text/css" media="print" onload="this.media='all'">
<noscript><link href="/wa-apps/shop/plugins/slider/css/lightslider.css?v1.3.4" rel="stylesheet" type="text/css"></noscript>

<style>
    .header-slider-wrap {
        padding: 0 0.75rem;
        overflow: visible;
        position: relative;
        margin-bottom: 0.5rem;
    }
    .header-slider {
        text-align: center;
        overflow: visible;
        max-width: 100%;
    }
    .header-slider .lSSlideOuter {
        max-width: 100%;
        margin: 0 auto;
        overflow: visible;
    }
    .header-slider .lSSlideWrapper {
        overflow: hidden !important;
        width: 100%;
        margin: 0 auto;
        position: relative;
        aspect-ratio: 1300 / 220;
        max-height: 220px;
    }
    .header-slider .lSSlideWrapper img {
        width: 100%;
        max-width: 100%;
        height: 100%;
        vertical-align: middle;
        display: block;
        margin: 0 auto;
        object-fit: contain;
    }
    @media (max-width: 1200px) {
        .header-slider .lSSlideWrapper {
            aspect-ratio: 992 / 660;
            max-height: 420px;
        }
    }
    @media (max-width: 480px) {
        .header-slider .lSSlideWrapper {
            aspect-ratio: 576 / 870;
            max-height: 420px;
        }
    }
    #slider-head,
    #slider-head > li {
        list-style: none !important;
        margin: 0;
        padding: 0;
    }
    #slider-head:not(.slider-ready) {
        margin: 0;
        padding: 0;
        overflow: hidden;
    }
    #slider-head:not(.slider-ready) > li:not(:first-child),
    .header-slider-wrap:not(.slider-ready) #slider-head li:nth-child(n+2) {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        overflow: hidden !important;
        margin: 0 !important;
        padding: 0 !important;
    }
    #slider-head:not(.slider-ready) > li:first-child,
    .header-slider-wrap:not(.slider-ready) #slider-head li:first-child {
        display: block !important;
        visibility: visible !important;
        width: 100%;
    }
    @media only screen and (max-width: 800px) {
        .header-slider-wrap {
            padding-left: 0;
            padding-right: 0;
        }
    }
    .header-slider-wrap .lSPager.lSpg {
        display: block !important;
        margin: 10px 0 0 !important;
        padding: 0 !important;
        text-align: center;
        line-height: 1;
    }
    .header-slider-wrap .lSPager.lSpg > li {
        padding: 0 5px;
    }
    .header-slider-wrap .lSPager.lSpg li a {
        display: inline-block;
        width: 10px;
        height: 10px;
        padding: 0;
        font-size: 0;
        line-height: 0;
        border-radius: 50%;
        background: #c5c5c5;
        overflow: hidden;
    }
    .header-slider-wrap .lSPager.lSpg li.active a,
    .header-slider-wrap .lSPager.lSpg li:hover a {
        background: #0497C0;
    }
    .header-slider-wrap .lSAction > a {
        background-image: none !important;
        background-color: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 50%;
        width: 36px;
        height: 36px;
        line-height: 34px;
        text-align: center;
        font-size: 22px;
        font-weight: 700;
        color: #0497C0;
        text-decoration: none;
        opacity: 1;
    }
    .header-slider-wrap .lSAction > .lSPrev::before {
        content: '‹';
    }
    .header-slider-wrap .lSAction > .lSNext::before {
        content: '›';
    }
</style>

<script type="text/javascript" src="/wa-apps/shop/plugins/slider/js/lightslider.js?v1.3.4" defer data-script-exception="1"></script>

<div class="header-slider">
    <ul id="slider-head">
        {foreach $slides as $s name=slider_slides}
            <li data-slide-id="{$s.id|escape}">
                <a href="{$s.link|escape}" class="slider-slide-link" data-slide-id="{$s.id|escape}">
                    <img src="{$s.img|escape}"
                         alt="{$s.alt|escape}"
                         width="1300"
                         height="220"
                         decoding="async"{if $smarty.foreach.slider_slides.first} fetchpriority="high"{else} loading="lazy"{/if}
                         data-desktop-src="{$s.img|escape}"
                         data-desktop-webp="{$s.img_webp|escape}"
                         data-tablet-src="{$s.img_tablet|escape}"
                         data-tablet-webp="{$s.img_tablet_webp|escape}"
                         data-mobile-src="{$s.img_mobile|escape}"
                         data-mobile-webp="{$s.img_mobile_webp|escape}">
                </a>
            </li>
        {/foreach}
    </ul>
</div>

<script>
    (function() {
        var TABLET_BREAKPOINT = 1200;
        var MOBILE_BREAKPOINT = 480;
        var slider = document.getElementById('slider-head');
        if (!slider) {
            return;
        }

        var supportsWebp = (function() {
            var canvas = document.createElement('canvas');
            canvas.width = 1;
            canvas.height = 1;
            return canvas.toDataURL('image/webp').indexOf('data:image/webp') === 0;
        })();

        function pickSrc(img) {
            var width = window.innerWidth || document.documentElement.clientWidth;
            var src = img.getAttribute('data-desktop-src');
            var webp = img.getAttribute('data-desktop-webp');
            if (width <= MOBILE_BREAKPOINT && img.getAttribute('data-mobile-src')) {
                src = img.getAttribute('data-mobile-src');
                webp = img.getAttribute('data-mobile-webp');
            } else if (width <= TABLET_BREAKPOINT && img.getAttribute('data-tablet-src')) {
                src = img.getAttribute('data-tablet-src');
                webp = img.getAttribute('data-tablet-webp');
            }
            if (supportsWebp && webp) {
                return webp;
            }
            return src;
        }

        function ensureSlideSrc(img) {
            if (!img) {
                return;
            }
            var src = pickSrc(img);
            if (src && img.getAttribute('src') !== src) {
                img.setAttribute('src', src);
            }
        }

        var imgs = slider.getElementsByTagName('img');
        for (var i = 0; i < imgs.length; i++) {
            ensureSlideSrc(imgs[i]);
        }

        window.almamedSliderEnsureSrc = ensureSlideSrc;
        window.almamedSliderSupportsWebp = supportsWebp;
    })();
</script>

<script>
    jQuery(function($) {
        var TABLET_BREAKPOINT = 1200;
        var MOBILE_BREAKPOINT = 480;
        var STAT_URL = {$stat_url};
        var $slider = $('#slider-head');
        if (!$slider.length) {
            return;
        }

        var trackedViews = {};
        var activeBucket = null;
        var resizeTimer = null;
        var rebuilding = false;
        var sliderInitialized = false;

        function getBreakpointBucket(width) {
            if (width <= MOBILE_BREAKPOINT) {
                return 'mobile';
            }
            if (width <= TABLET_BREAKPOINT) {
                return 'tablet';
            }
            return 'desktop';
        }

        function sendStat(slideId, type) {
            if (!STAT_URL || !slideId) {
                return;
            }
            $.ajax({
                url: STAT_URL,
                type: 'POST',
                data: { id: slideId, type: type },
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
        }

        function trackView(slideId) {
            slideId = parseInt(slideId, 10);
            if (!slideId || trackedViews[slideId]) {
                return;
            }
            trackedViews[slideId] = true;
            sendStat(slideId, 'view');
        }

        function getActiveSlideId() {
            var $active = $slider.find('li.active').first();
            if (!$active.length) {
                $active = $slider.children('li').first();
            }
            return $active.data('slide-id');
        }

        function preloadVisibleSlides() {
            $slider.find('img').each(function() {
                if (window.almamedSliderEnsureSrc) {
                    window.almamedSliderEnsureSrc(this);
                }
            });
        }

        $slider.on('click', '.slider-slide-link', function() {
            sendStat($(this).data('slide-id'), 'click');
        });

        function pickSrc($img) {
            var width = window.innerWidth || document.documentElement.clientWidth;
            var src = $img.data('desktop-src');
            var webp = $img.data('desktop-webp');
            if (width <= MOBILE_BREAKPOINT && $img.data('mobile-src')) {
                src = $img.data('mobile-src');
                webp = $img.data('mobile-webp');
            } else if (width <= TABLET_BREAKPOINT && $img.data('tablet-src')) {
                src = $img.data('tablet-src');
                webp = $img.data('tablet-webp');
            }
            if (window.almamedSliderSupportsWebp && webp) {
                return webp;
            }
            return src;
        }

        function applyResponsiveSrc() {
            $slider.find('img').each(function() {
                var $img = $(this);
                var src = pickSrc($img);
                if (src && $img.attr('src') !== src) {
                    $img.attr('src', src);
                }
            });
        }

        function whenAllImagesReady() {
            var waits = [];
            $slider.find('img').each(function() {
                var deferred = $.Deferred();
                var img = this;
                if (img.complete) {
                    deferred.resolve();
                } else {
                    $(img).one('load error', function() {
                        deferred.resolve();
                    });
                    setTimeout(function() {
                        deferred.resolve();
                    }, 3000);
                }
                waits.push(deferred.promise());
            });
            return waits.length ? $.when.apply($, waits) : $.when();
        }

        function sliderOptions(width) {
            var bucket = getBreakpointBucket(width);

            return {
                item: 1,
                slideMove: 1,
                pause: 5000,
                controls: true,
                pager: true,
                loop: $slider.children('li').length > 1,
                auto: $slider.children('li').length > 1,
                enableDrag: bucket !== 'desktop',
                easing: 'cubic-bezier(0.25, 0, 0.25, 1)',
                speed: 600,
                adaptiveHeight: false,
                slideMargin: bucket === 'desktop' ? 0 : 6,
                onBeforeSlide: function() {
                    preloadVisibleSlides();
                },
                onAfterSlide: function() {
                    preloadVisibleSlides();
                    trackView(getActiveSlideId());
                }
            };
        }

        function destroySlider() {
            if ($slider.hasClass('lightSlider') && typeof $slider.destroy === 'function') {
                try {
                    $slider.destroy();
                } catch (e) {}
            }
            $slider.removeClass('slider-ready lightSlider lSSlide');
            $('.header-slider-wrap').removeClass('slider-ready');
        }

        function initSlider() {
            if (!$.fn.lightSlider) {
                return false;
            }

            destroySlider();
            var width = window.innerWidth || document.documentElement.clientWidth;
            activeBucket = getBreakpointBucket(width);

            if ($slider.children('li').length < 1) {
                return false;
            }

            $slider.children('li').each(function() {
                this.style.display = '';
            });

            preloadVisibleSlides();

            try {
                $slider.lightSlider(sliderOptions(width));
                $slider.addClass('slider-ready');
                $('.header-slider-wrap').addClass('slider-ready');
                trackView(getActiveSlideId());
                sliderInitialized = true;
                return true;
            } catch (e) {
                $slider.removeClass('slider-ready');
                $('.header-slider-wrap').removeClass('slider-ready');
                return false;
            }
        }

        function rebuildSlider(force) {
            if (rebuilding) {
                return;
            }

            var width = window.innerWidth || document.documentElement.clientWidth;
            var bucket = getBreakpointBucket(width);
            if (!force && sliderInitialized && bucket === activeBucket && $slider.hasClass('slider-ready')) {
                return;
            }

            rebuilding = true;
            applyResponsiveSrc();
            whenAllImagesReady().always(function() {
                initSlider();
                rebuilding = false;
            });
        }

        function bootSlider(attempt) {
            if ($.fn.lightSlider) {
                rebuildSlider(true);
                return;
            }
            if (attempt > 100) {
                return;
            }
            setTimeout(function() {
                bootSlider(attempt + 1);
            }, 50);
        }

        bootSlider(0);

        $(window).on('resize orientationchange', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                rebuildSlider(false);
            }, 250);
        });
    });
</script>
