<link href="/wa-apps/shop/plugins/slider/css/lightslider.css?{time()}" rel="stylesheet" type="text/css">

<style>
    .header-slider {
        text-align: center;
        overflow: hidden;
    }
    .header-slider img {
        width: 100%;
        max-width: 100%;
        height: auto;
        vertical-align: middle;
    }
    /* До init lightSlider — только первый слайд, без «стопки» баннеров */
    #slider-head:not(.lSSlide) {
        margin: 0;
        padding: 0;
        list-style: none;
        overflow: hidden;
    }
    #slider-head:not(.lSSlide) > li:not(:first-child) {
        display: none;
    }
    @media only screen and (max-width: 800px) {
        .header-slider {
            margin-left: -0.75rem;
            margin-right: -0.75rem;
        }
    }
</style>

<script type="text/javascript" src="/wa-apps/shop/plugins/slider/js/lightslider.js?{time()}"></script>

<div class="header-slider">
    <ul id="slider-head">
        {foreach $slides as $s}
            <li>
                <a href="{$s.link|escape}">
                    <img src="{$s.img|escape}" alt="{$s.alt|escape}"{if !empty($s.img_mobile) && $s.img_mobile != $s.img} data-mobile-src="{$s.img_mobile|escape}"{/if}>
                </a>
            </li>
        {/foreach}
    </ul>
</div>

<script>
    jQuery(function($) {
        if (!$.fn.lightSlider) {
            return;
        }

        var $slider = $('#slider-head');
        if (!$slider.length || $slider.hasClass('lightSlider')) {
            return;
        }

        if (window.matchMedia('(max-width: 800px)').matches) {
            $slider.find('img[data-mobile-src]').each(function() {
                var mobileSrc = $(this).attr('data-mobile-src');
                if (mobileSrc) {
                    $(this).attr('src', mobileSrc);
                }
            });
        }

        $slider.lightSlider({
            item: 1,
            slideMove: 1,
            pause: 5000,
            controls: false,
            pager: false,
            loop: true,
            auto: true,
            enableDrag: false,
            easing: 'cubic-bezier(0.25, 0, 0.25, 1)',
            speed: 600,
            adaptiveHeight: true,
            slideMargin: 0,
            responsive: [
                {
                    breakpoint: 800,
                    settings: {
                        item: 1,
                        slideMove: 1,
                        slideMargin: 0,
                        enableDrag: true
                    }
                },
                {
                    breakpoint: 480,
                    settings: {
                        item: 1,
                        slideMove: 1,
                        slideMargin: 0,
                        enableDrag: true
                    }
                }
            ]
        });
    });
</script>
