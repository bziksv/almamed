<link href="/wa-apps/shop/plugins/slider/css/lightslider.css?{time()}" rel="stylesheet" type="text/css">

<style>
    .header-slider {
        text-align: center;
    }
</style>

<script type="text/javascript" src="/wa-apps/shop/plugins/slider/js/lightslider.js?{time()}"></script>

<div class="header-slider">
    <ul id="slider-head" style="list-style: none">
        {foreach $slides as $s}
            <li>
                <a href="{$s.link|escape}">
                    <img src="{$s.img|escape}"
                         alt="{$s.alt|escape}"
                         data-desktop-src="{$s.img|escape}"
                         data-tablet-src="{$s.img_tablet|escape}"
                         data-mobile-src="{$s.img_mobile|escape}">
                </a>
            </li>
        {/foreach}
    </ul>
</div>

<script>
    jQuery(function($) {
        var $slider = $('#slider-head');
        if (!$slider.length || !$.fn.lightSlider) {
            return;
        }

        function responsiveSlideSrc() {
            var width = window.innerWidth || document.documentElement.clientWidth;
            $slider.find('img').each(function() {
                var $img = $(this);
                var src = $img.data('desktop-src');
                if (width <= 480 && $img.data('mobile-src')) {
                    src = $img.data('mobile-src');
                } else if (width <= 992 && $img.data('tablet-src')) {
                    src = $img.data('tablet-src');
                }
                if (src) {
                    $img.attr('src', src);
                }
            });
        }

        responsiveSlideSrc();

        $slider.lightSlider({
            item: 1,
            slideMove: 1,
            pause: 5000,
            controls: false,
            loop: true,
            auto: true,
            enableDrag: false,
            easing: 'cubic-bezier(0.25, 0, 0.25, 1)',
            speed: 600,
            adaptiveHeight: true,
            slideMargin: 0,
            responsive: [
                {
                    breakpoint: 800,
                    settings: {
                        item: 1,
                        slideMove: 1,
                        slideMargin: 6,
                        enableDrag: true
                    }
                },
                {
                    breakpoint: 480,
                    settings: {
                        item: 1,
                        slideMove: 1,
                        enableDrag: true
                    }
                }
            ]
        });
    });
</script>
