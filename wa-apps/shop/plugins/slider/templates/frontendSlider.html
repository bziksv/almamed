<style>
    .header-slider-wrap {
        padding: 0 0.75rem;
        position: relative;
        margin-bottom: 0;
    }
    .header-slider {
        position: relative;
        width: 100%;
        max-width: 100%;
        overflow: hidden;
    }
    .almamed-slider {
        position: relative;
        width: 100%;
        line-height: 0;
    }
    .almamed-slider__slide {
        display: none;
        width: 100%;
    }
    .almamed-slider__slide.is-active {
        display: block;
    }
    .almamed-slider__slide a {
        display: block;
        line-height: 0;
    }
    .almamed-slider__slide img {
        width: 100%;
        height: auto;
        max-width: 100%;
        display: block;
        margin: 0 auto;
    }
    @media only screen and (max-width: 800px) {
        .header-slider-wrap {
            padding-left: 0;
            padding-right: 0;
        }
    }
    .almamed-slider-dots {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 4px;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin: 0;
        padding: 0;
        pointer-events: none;
        -webkit-tap-highlight-color: transparent;
    }
    .almamed-slider-dot {
        pointer-events: auto;
        box-sizing: content-box;
        width: 9px;
        height: 9px;
        border: none;
        border-radius: 50%;
        padding: 8px;
        margin: 0;
        background-color: #d1edf5;
        background-clip: content-box;
        cursor: pointer;
        filter: drop-shadow(0 0 1px rgba(0, 0, 0, 0.35));
        transition: background-color 0.3s ease, transform 0.3s ease;
        touch-action: manipulation;
    }
    .almamed-slider-dot.is-active {
        background-color: #0497C0;
        filter: drop-shadow(0 1px 2px rgba(4, 151, 192, 0.55));
        transform: scale(1.15);
    }
    .almamed-slider-dot:hover {
        background: #b8e4f0;
    }
    .almamed-slider-dot.is-active:hover {
        background: #036884;
    }
    .almamed-slider.is-touching {
        touch-action: pan-y;
    }
</style>

<div class="header-slider">
    <div class="almamed-slider" id="almamed-slider">
        {foreach $slides as $s name=slider_slides}
            <div class="almamed-slider__slide{if $smarty.foreach.slider_slides.first} is-active{/if}"
                 data-slide-id="{$s.id|escape}">
                <a href="{$s.link|escape}" class="slider-slide-link" data-slide-id="{$s.id|escape}">
                    <picture>
                        {if $s.img_mobile_webp}
                        <source media="(max-width: 480px)" type="image/webp" srcset="{$s.img_mobile_webp|escape}{if $s.img_mobile_w} {$s.img_mobile_w|escape}w{/if}">
                        {/if}
                        {if $s.img_mobile}
                        <source media="(max-width: 480px)" srcset="{$s.img_mobile|escape}{if $s.img_mobile_w} {$s.img_mobile_w|escape}w{/if}">
                        {/if}
                        {if $s.img_tablet_webp}
                        <source media="(max-width: 1200px)" type="image/webp" srcset="{$s.img_tablet_webp|escape}{if $s.img_tablet_w} {$s.img_tablet_w|escape}w{/if}">
                        {/if}
                        {if $s.img_tablet}
                        <source media="(max-width: 1200px)" srcset="{$s.img_tablet|escape}{if $s.img_tablet_w} {$s.img_tablet_w|escape}w{/if}">
                        {/if}
                        {if $s.img_webp}
                        <source type="image/webp" srcset="{$s.img_webp|escape}{if $s.img_w} {$s.img_w|escape}w{/if}">
                        {/if}
                        <img src="{$s.img|escape}"
                             srcset="{$s.img|escape}{if $s.img_w} {$s.img_w|escape}w{/if}"
                             sizes="(max-width: 480px) 100vw, (max-width: 1200px) 100vw, min(100vw, 1300px)"
                             alt="{$s.alt|escape}"
                             width="{$s.img_w|default:1300|escape}"
                             height="{$s.img_h|default:220|escape}"
                             decoding="async"{if $smarty.foreach.slider_slides.first} fetchpriority="high"{else} loading="lazy"{/if}>
                    </picture>
                </a>
            </div>
        {/foreach}
        {if $slides|@count > 1}
        <nav class="almamed-slider-dots" aria-label="[`Slides`]">
            {foreach $slides as $s name=slider_dots}
                <button type="button"
                        class="almamed-slider-dot{if $smarty.foreach.slider_dots.first} is-active{/if}"
                        data-slide-to="{$smarty.foreach.slider_dots.index}"
                        data-slide-id="{$s.id|escape}"
                        aria-label="Слайд {$smarty.foreach.slider_dots.iteration}"></button>
            {/foreach}
        </nav>
        {/if}
    </div>
</div>

<script>
(function() {
    var AUTOPLAY_MS = 5000;
    var STAT_URL = {$stat_url};

    var root = document.getElementById('almamed-slider');
    if (!root) {
        return;
    }

    var slides = root.querySelectorAll('.almamed-slider__slide');
    var nav = root.querySelector('.almamed-slider-dots');
    var dots = nav ? nav.querySelectorAll('.almamed-slider-dot') : [];
    var current = 0;
    var autoTimer = null;
    var trackedViews = {};
    var wrap = root.closest('.header-slider-wrap');
    var touchStartX = 0;
    var touchStartY = 0;
    var swipeBlockedClick = false;
    var SWIPE_THRESHOLD = 36;

    function sendStat(slideId, type) {
        if (!STAT_URL || !slideId || !window.fetch) {
            return;
        }
        var body = new URLSearchParams();
        body.append('id', slideId);
        body.append('type', type);
        fetch(STAT_URL, {
            method: 'POST',
            body: body,
            headers: { 'X-Requested-With': 'XMLHttpRequest' },
            credentials: 'same-origin'
        }).catch(function() {});
    }

    function trackView(index) {
        var slide = slides[index];
        if (!slide) {
            return;
        }
        var slideId = parseInt(slide.getAttribute('data-slide-id'), 10);
        if (!slideId || trackedViews[slideId]) {
            return;
        }
        trackedViews[slideId] = true;
        sendStat(slideId, 'view');
    }

    function syncNav() {
        for (var i = 0; i < dots.length; i++) {
            dots[i].classList.toggle('is-active', i === current);
        }
    }

    function showSlide(index) {
        if (!slides.length) {
            return;
        }
        if (index < 0) {
            index = slides.length - 1;
        }
        if (index >= slides.length) {
            index = 0;
        }
        current = index;
        for (var i = 0; i < slides.length; i++) {
            slides[i].classList.toggle('is-active', i === current);
        }
        syncNav();
        trackView(current);
        if (wrap) {
            wrap.classList.add('slider-ready');
        }
    }

    function startAutoPlay() {
        if (slides.length < 2) {
            return;
        }
        clearInterval(autoTimer);
        autoTimer = setInterval(function() {
            showSlide(current + 1);
        }, AUTOPLAY_MS);
    }

    function stopAutoPlay() {
        clearInterval(autoTimer);
    }

    root.addEventListener('click', function(e) {
        if (swipeBlockedClick) {
            e.preventDefault();
            e.stopPropagation();
            return;
        }
        if (e.target.closest('.almamed-slider-dot')) {
            e.preventDefault();
            showSlide(parseInt(e.target.closest('.almamed-slider-dot').getAttribute('data-slide-to'), 10));
            startAutoPlay();
            return;
        }
        var link = e.target.closest('.slider-slide-link');
        if (link) {
            sendStat(link.getAttribute('data-slide-id'), 'click');
        }
    });

    if (slides.length > 1) {
        root.addEventListener('touchstart', function(e) {
            if (!e.changedTouches || !e.changedTouches.length) {
                return;
            }
            touchStartX = e.changedTouches[0].clientX;
            touchStartY = e.changedTouches[0].clientY;
            swipeBlockedClick = false;
            root.classList.add('is-touching');
            stopAutoPlay();
        }, { passive: true });

        root.addEventListener('touchmove', function(e) {
            if (!e.changedTouches || !e.changedTouches.length) {
                return;
            }
            var dx = e.changedTouches[0].clientX - touchStartX;
            var dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 12) {
                swipeBlockedClick = true;
            }
        }, { passive: true });

        root.addEventListener('touchend', function(e) {
            root.classList.remove('is-touching');
            if (!e.changedTouches || !e.changedTouches.length) {
                startAutoPlay();
                return;
            }
            var dx = e.changedTouches[0].clientX - touchStartX;
            var dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) >= SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
                swipeBlockedClick = true;
                if (dx < 0) {
                    showSlide(current + 1);
                } else {
                    showSlide(current - 1);
                }
                e.preventDefault();
            }
            startAutoPlay();
            if (swipeBlockedClick) {
                setTimeout(function() {
                    swipeBlockedClick = false;
                }, 350);
            }
        }, { passive: false });

        root.addEventListener('touchcancel', function() {
            root.classList.remove('is-touching');
            startAutoPlay();
        }, { passive: true });
    }

    if (wrap) {
        wrap.addEventListener('mouseenter', stopAutoPlay);
        wrap.addEventListener('mouseleave', startAutoPlay);
    }

    showSlide(0);
    startAutoPlay();
})();
</script>
