{capture assign="inline_assets"}
{if !empty($assets_links.css)}
<script type="text/javascript">
{literal}
(function() {
	var loader = window.shop_searchpro && window.shop_searchpro.loader;
	if (!loader) {
		return;
	}
{/literal}
{foreach $assets_links.css as $css}
	loader.loadCss('{$css.url}');
{/foreach}
{literal}
})();
{/literal}
</script>
{/if}
{/capture}
{if $wrapper}
<div class="{$wrapper.class|default:''}" id="{$wrapper.id|default:''}" {foreach $data as $field => $value} data-{$field}="{$value|escape|strip}" {/foreach}>
{/if}
	{$content}
{if $wrapper}
</div>
{/if}
{$inline_assets|strip}
