# Static assets — вставить в server {} на prod (FastPanel nginx перед Apache).
# Проверка brotli: nginx -V 2>&1 | grep brotli
# Если модуля нет — оставить только gzip (уже включён в vhost).

# Immutable public uploads (thumbs, promos, theme assets)
location ^~ /wa-data/public/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}

# Framework static (JS/CSS/fonts)
location ^~ /wa-content/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
    try_files $uri =404;
}

# Brotli (раскомментировать если ngx_brotli установлен)
# brotli on;
# brotli_comp_level 5;
# brotli_types text/css application/javascript application/json image/svg+xml text/plain text/xml;
