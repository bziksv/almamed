worker_processes  2;
error_log  RUN_DIR/nginx-error.log;
pid        RUN_DIR/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    gzip  on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen       8080 default_server;
        server_name  localhost 127.0.0.1 almamed.su almamed.su:8080;
        root         PROJECT_ROOT;
        index        index.php;

        client_max_body_size 64m;

        # Кастомные темы — только локально (в git, dev)
        location ^~ /wa-data/public/shop/themes/ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            access_log off;
            try_files $uri =404;
        }

        location ^~ /wa-data/public/site/themes/ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            access_log off;
            try_files $uri =404;
        }

        location ^~ /wa-data/public/blog/themes/ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            access_log off;
            try_files $uri =404;
        }

        # Остальной wa-data: локально если есть, иначе proxy на prod
        location ^~ /wa-data/public/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            access_log off;
            error_page 404 = @wa_data_prod;
            try_files $uri =404;
        }

        location @wa_data_prod {
            resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
            proxy_pass https://PROD_MEDIA_HOST;
            proxy_set_header Host PROD_MEDIA_HOST;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_ssl_server_name on;
            proxy_ssl_name PROD_MEDIA_HOST;
            proxy_redirect off;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_intercept_errors off;
        }

        location ^~ /wa-content/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ @webasyst;
        }

        location @webasyst {
            rewrite ^/(.*)$ /index.php/$1 last;
        }

        location ~ ^/index\.php(/|$) {
            try_files /index.php =404;
            include        /opt/homebrew/etc/nginx/fastcgi_params;
            fastcgi_pass   127.0.0.1:9072;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root/index.php;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_param  PATH_INFO $fastcgi_path_info;
            fastcgi_read_timeout 300;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include        /opt/homebrew/etc/nginx/fastcgi_params;
            fastcgi_pass   127.0.0.1:9072;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 300;
        }

        location ~ /\. {
            deny all;
        }
    }
}
