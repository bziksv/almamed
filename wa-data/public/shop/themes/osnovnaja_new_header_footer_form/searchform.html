{strip}
	{* SearchPro живёт в shop; на blog/site класс может быть не загружен — без проверки страница 500 *}
	{if class_exists('shopSearchproPluginViewHelper')}
		<link href="{$searchform_theme_url|default:$wa_active_theme_url}searchpro_plugin_field.css?v{$wa_theme_version}" rel="stylesheet">
		<div class="search-pro">
			{shopSearchproPluginViewHelper::field()}
		</div>
	{else}
		<form method="get" action="{$wa->getUrl('shop/frontend/search')}">
			<div class="search-wrapper">
				<button type="submit"><i class="material-icons mi-2x">&#xE8B6;</i></button>
				<input{if empty($mobile_search)} id="search"{/if} type="search" name="query" {if !empty($query)}value="{$query|escape}"{/if} placeholder="Поиск товара">
			</div>
		</form>
	{/if}
{/strip}
