{strip}
<style>
.share-native { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: .875rem; line-height: 1.4; }
.share-native__label { color: #777; margin-right: 2px; }
.share-native__link { display: inline-block; padding: 4px 10px; border: 1px solid rgba(51,51,51,.12); border-radius: 4px; background: #f5f5f5; color: rgba(0,0,0,.87); text-decoration: none; cursor: pointer; font: inherit; }
.share-native__link:hover { background: #eee; }
</style>
{$share_url = $wa->currentUrl(true)|escape:'url'}
{$share_title = ($product.name|default:$wa->title())|escape:'url'}
<div class="share-native" aria-label="Поделиться">
    <span class="share-native__label">Поделиться:</span>
    <a class="share-native__link" href="https://vk.com/share.php?url={$share_url}&amp;title={$share_title}" target="_blank" rel="noopener noreferrer nofollow" title="ВКонтакте">VK</a>
    <a class="share-native__link" href="https://t.me/share/url?url={$share_url}&amp;text={$share_title}" target="_blank" rel="noopener noreferrer nofollow" title="Telegram">TG</a>
    <a class="share-native__link" href="https://api.whatsapp.com/send?text={$share_title}%20{$share_url}" target="_blank" rel="noopener noreferrer nofollow" title="WhatsApp">WA</a>
    <a class="share-native__link" href="https://connect.ok.ru/offer?url={$share_url}&amp;title={$share_title}" target="_blank" rel="noopener noreferrer nofollow" title="Одноклассники">OK</a>
    <button type="button" class="share-native__link share-native__copy" data-share-url="{$wa->currentUrl(true)|escape}" title="Скопировать ссылку">Ссылка</button>
</div>
<script>
(function() {
    var btn = document.querySelector('.share-native__copy');
    if (!btn || !navigator.clipboard) {
        if (btn) { btn.style.display = 'none'; }
        return;
    }
    btn.addEventListener('click', function() {
        navigator.clipboard.writeText(btn.getAttribute('data-share-url') || window.location.href);
    });
})();
</script>
{/strip}
