{strip}
<style>
.share-native { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .875rem; line-height: 1; }
.share-native__label { color: #777; margin-right: 4px; }
.share-native__link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 1px solid rgba(51,51,51,.12);
    border-radius: 4px;
    background: #f5f5f5;
    color: rgba(0,0,0,.72);
    text-decoration: none;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
}
.share-native__link svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
    flex-shrink: 0;
}
.share-native__link:hover { background: #eee; color: #fff; border-color: transparent; }
.share-native__link--vk:hover { background: #4680c2; }
.share-native__link--tg:hover { background: #229ed9; }
.share-native__link--wa:hover { background: #25d366; }
.share-native__link--ok:hover { background: #ee8208; }
.share-native__link--copy:hover { background: #607d8b; }
</style>
{$share_url = $wa->currentUrl(true)|escape:'url'}
{$share_title = ($product.name|default:$wa->title())|escape:'url'}

</div>
<script>
(function() {
    var root = document.currentScript && document.currentScript.previousElementSibling;
    if (!root || !root.classList.contains('share-native')) {
        root = document.querySelector('.share-native');
    }
    if (!root) { return; }
    var btn = root.querySelector('.share-native__copy');
    if (!btn) { return; }
    if (!navigator.clipboard) {
        btn.style.display = 'none';
        return;
    }
    btn.addEventListener('click', function() {
        navigator.clipboard.writeText(btn.getAttribute('data-share-url') || window.location.href);
        btn.setAttribute('title', 'Ссылка скопирована');
        setTimeout(function() { btn.setAttribute('title', 'Скопировать ссылку'); }, 2000);
    });
})();
</script>
{/strip}
