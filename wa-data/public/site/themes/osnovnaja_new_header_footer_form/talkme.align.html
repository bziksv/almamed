{strip}
<style>
@media only screen and (min-width: 993px) {
    #footer-pane .col-grid.stay-chat {
        width: 1%;
        min-width: 168px;
        padding: 0 !important;
        vertical-align: middle;
    }

    #footer-pane .stay-chat .almamed-chat-open {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 56px;
        margin: 0;
        padding: 0 12px;
        border: none;
        background-color: #19a5cc;
        color: #fff;
        font: inherit;
        line-height: 56px;
        text-align: center;
        white-space: nowrap;
        cursor: pointer;
        box-sizing: border-box;
        text-decoration: none;
    }

    #footer-pane .stay-chat .almamed-chat-open .material-icons {
        color: #fff;
        vertical-align: middle;
        margin-top: -0.25em;
        margin-right: 0.25em;
    }

    #footer-pane .stay-chat .almamed-chat-open span {
        border-bottom: 1px solid #fff;
    }

    #footer-pane .stay-chat .almamed-chat-open:hover {
        background-color: #1496b8;
    }

    #footer-pane:hover .row-grid .table-grid .col-grid {
        line-height: 56px;
    }

    #footer-pane .row-grid .table-grid .col-grid {
        transition: none;
    }

    #almamed-cookie-consent .cookie-consent__chat {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 40px;
        padding: 0 16px;
        border: none;
        border-radius: 6px;
        background: #0497C0;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        box-sizing: border-box;
    }

    #almamed-cookie-consent .cookie-consent__chat .material-icons {
        font-size: 18px;
        line-height: 1;
    }

    #almamed-cookie-consent .cookie-consent__chat:hover {
        background: #036884;
    }

    /* Скрываем плавающую кнопку Talk-Me на ПК — используем «Напишите нам» в футере */
    body.almamed-custom-chat .online-chat-root .online-chat-trigger,
    body.almamed-custom-chat .online-chat-root .trigger-classic,
    body.almamed-custom-chat .online-chat-root .trigger-round,
    body.almamed-custom-chat .online-chat-root .trigger-background {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
    }
}

@media only screen and (max-width: 768px) {
    #almamed-cookie-consent .cookie-consent__chat {
        width: calc(100% - 48px);
        margin-left: 48px;
    }
}
</style>

<script>
;(function(window, document) {
    'use strict';

    var DESKTOP_MIN = 993;
    var MENU_CLOSE_DELAY = 350;
    var menuCloseTimer = null;

    function isDesktop() {
        return window.matchMedia('(min-width: ' + DESKTOP_MIN + 'px)').matches;
    }

    function talkMe() {
        return typeof window.TalkMe === 'function' ? window.TalkMe : null;
    }

    function getChatButton() {
        return document.querySelector('#footer-pane .almamed-chat-open') || document.querySelector('.almamed-chat-open');
    }

    function alignTriggerToFooter() {
        var api = talkMe();
        var btn = getChatButton();
        if (!api || !btn) {
            return;
        }

        var rect = btn.getBoundingClientRect();
        var bottom = Math.max(0, Math.round(window.innerHeight - rect.bottom));
        var right = Math.max(0, Math.round(window.innerWidth - rect.right));

        try {
            api('setTriggerPosition', 'bottom', bottom);
            api('setTriggerPosition', 'right', right, true);
        } catch (e) {}
    }

    function openTalkMeMenu() {
        var api = talkMe();
        if (!api) {
            return false;
        }

        alignTriggerToFooter();

        try {
            api('openMenu');
            return true;
        } catch (e) {}

        return false;
    }

    function closeTalkMeMenu() {
        var api = talkMe();
        if (!api) {
            return;
        }
        try {
            api('closeMenu');
        } catch (e) {}
    }

    function cancelCloseMenu() {
        if (menuCloseTimer) {
            window.clearTimeout(menuCloseTimer);
            menuCloseTimer = null;
        }
    }

    function scheduleCloseMenu() {
        cancelCloseMenu();
        menuCloseTimer = window.setTimeout(function() {
            closeTalkMeMenu();
            menuCloseTimer = null;
        }, MENU_CLOSE_DELAY);
    }

    function isTalkMeUi(node) {
        return !!(node && node.closest && node.closest('.online-chat-root'));
    }

    function syncTriggerMode() {
        if (isDesktop()) {
            document.body.classList.add('almamed-custom-chat');
            alignTriggerToFooter();
            return;
        }

        document.body.classList.remove('almamed-custom-chat');
        cancelCloseMenu();
        closeTalkMeMenu();

        var api = talkMe();
        if (api) {
            try {
                api('showTrigger');
            } catch (e) {}
        }
    }

    document.addEventListener('click', function(e) {
        var btn = e.target.closest('.almamed-chat-open');
        if (!btn) {
            return;
        }
        e.preventDefault();
        cancelCloseMenu();
        openTalkMeMenu();
    });

    document.addEventListener('mouseenter', function(e) {
        if (!isDesktop()) {
            return;
        }
        if (e.target.closest('.almamed-chat-open')) {
            cancelCloseMenu();
            openTalkMeMenu();
            return;
        }
        if (isTalkMeUi(e.target)) {
            cancelCloseMenu();
        }
    }, true);

    document.addEventListener('mouseleave', function(e) {
        if (!isDesktop()) {
            return;
        }

        if (e.target.closest('.almamed-chat-open')) {
            scheduleCloseMenu();
            return;
        }

        if (isTalkMeUi(e.target) && !isTalkMeUi(e.relatedTarget)) {
            scheduleCloseMenu();
        }
    }, true);

    var attempts = 0;
    var poll = window.setInterval(function() {
        attempts += 1;
        syncTriggerMode();
        if (talkMe() || attempts > 120) {
            window.clearInterval(poll);
        }
    }, 250);

    window.addEventListener('resize', function() {
        syncTriggerMode();
        if (isDesktop()) {
            alignTriggerToFooter();
        }
    });
    window.addEventListener('load', syncTriggerMode);
    window.addEventListener('scroll', function() {
        if (isDesktop()) {
            alignTriggerToFooter();
        }
    }, { passive: true });
})(window, document);
</script>
{/strip}
