{strip}
<style>
@media only screen and (min-width: 993px) {
    #footer-pane .col-grid.stay-chat {
        width: 1%;
        min-width: 168px;
        padding: 0 !important;
        vertical-align: middle;
    }

    #talkme-slot {
        height: 56px;
    }

    #talkme-cookie-slot {
        height: 40px;
    }

    .online-chat-root .online-chat-widget-container.almamed-talkme-docked {
        position: fixed !important;
        z-index: 1003 !important;
        margin: 0 !important;
        transform: none !important;
        overflow: visible !important;
    }

    .online-chat-root .online-chat-widget-container.almamed-talkme-docked .online-chat-trigger,
    .online-chat-root .online-chat-widget-container.almamed-talkme-docked .trigger-classic,
    .online-chat-root .online-chat-widget-container.almamed-talkme-docked .trigger-background {
        width: 100% !important;
        height: 100% !important;
        min-height: 0 !important;
        max-height: none !important;
        border-radius: 0 !important;
        box-sizing: border-box !important;
    }

    body.almamed-talkme-docked .online-chat-root .online-chat-widget-container:not(.almamed-talkme-docked) {
        visibility: hidden !important;
        pointer-events: none !important;
    }
}
</style>

<script>
;(function(window, document) {
    'use strict';

    var DESKTOP_MIN = 993;

    function isDesktop() {
        return window.matchMedia('(min-width: ' + DESKTOP_MIN + 'px)').matches;
    }

    function isVisible(el) {
        if (!el) {
            return false;
        }
        var style = window.getComputedStyle(el);
        return style.display !== 'none' && style.visibility !== 'hidden';
    }

    function isCookieBannerVisible() {
        var banner = document.getElementById('almamed-cookie-consent');
        return !!(banner && banner.classList.contains('is-visible'));
    }

    function isFooterPaneVisible() {
        return isVisible(document.getElementById('footer-pane'));
    }

    function getActiveSlot() {
        if (!isDesktop()) {
            return null;
        }
        if (isCookieBannerVisible()) {
            return document.getElementById('talkme-cookie-slot');
        }
        if (isFooterPaneVisible()) {
            return document.getElementById('talkme-slot');
        }
        return null;
    }

    function getWidgetContainer() {
        var root = document.querySelector('.online-chat-root');
        if (!root) {
            return null;
        }
        return root.querySelector('.online-chat-widget-container') || root;
    }

    function resetDockStyles(container) {
        container.classList.remove('almamed-talkme-docked');
        container.style.removeProperty('left');
        container.style.removeProperty('bottom');
        container.style.removeProperty('width');
        container.style.removeProperty('height');
        container.style.removeProperty('right');
        container.style.removeProperty('top');
    }

    function dockTalkMe() {
        var slot = getActiveSlot();
        var container = getWidgetContainer();

        if (!container) {
            return;
        }

        if (!slot) {
            document.body.classList.remove('almamed-talkme-docked');
            resetDockStyles(container);
            if (typeof window.TalkMe === 'function') {
                try {
                    window.TalkMe('showTrigger');
                    window.TalkMe('setTriggerPosition', 'bottom', 0);
                    window.TalkMe('setTriggerPosition', 'right', 0, true);
                } catch (e) {}
            }
            return;
        }

        if (typeof window.TalkMe === 'function') {
            try {
                window.TalkMe('showTrigger');
            } catch (e) {}
        }

        document.body.classList.add('almamed-talkme-docked');
        container.classList.add('almamed-talkme-docked');

        var rect = slot.getBoundingClientRect();
        var width = Math.max(rect.width, slot.offsetWidth || 168);
        var height = Math.max(rect.height, slot.offsetHeight || 56);

        container.style.setProperty('left', rect.left + 'px', 'important');
        container.style.setProperty('bottom', (window.innerHeight - rect.bottom) + 'px', 'important');
        container.style.setProperty('width', width + 'px', 'important');
        container.style.setProperty('height', height + 'px', 'important');
        container.style.setProperty('right', 'auto', 'important');
        container.style.setProperty('top', 'auto', 'important');
    }

    var scheduled = false;
    function scheduleUpdate() {
        if (scheduled) {
            return;
        }
        scheduled = true;
        window.requestAnimationFrame(function() {
            scheduled = false;
            dockTalkMe();
        });
    }

    var attempts = 0;
    var poll = window.setInterval(function() {
        attempts += 1;
        scheduleUpdate();
        if (document.querySelector('.online-chat-root') || attempts > 120) {
            window.clearInterval(poll);
        }
    }, 250);

    window.addEventListener('resize', scheduleUpdate);
    window.addEventListener('scroll', scheduleUpdate, { passive: true });
    window.addEventListener('load', scheduleUpdate);

    document.addEventListener('click', function(e) {
        if (e.target && e.target.id === 'almamed-cookie-consent-accept') {
            window.setTimeout(scheduleUpdate, 50);
            window.setTimeout(scheduleUpdate, 450);
        }
    });

    if (window.MutationObserver) {
        var observer = new MutationObserver(scheduleUpdate);
        observer.observe(document.body, {
            attributes: true,
            attributeFilter: ['class'],
            childList: true,
            subtree: true
        });
    }

    var footerPane = document.getElementById('footer-pane');
    if (footerPane) {
        footerPane.addEventListener('mouseenter', scheduleUpdate);
        footerPane.addEventListener('mouseleave', scheduleUpdate);
    }
})(window, document);
</script>
{/strip}
