{strip}
<style>
@media only screen and (min-width: 993px) {
    #footer-pane .col-grid.stay-chat {
        width: 1%;
        min-width: 168px;
        padding: 0 !important;
        vertical-align: middle;
    }

    #footer-pane .stay-chat .almamed-chat-open {
        display: block;
        width: 100%;
        height: 56px;
        margin: 0;
        padding: 0 12px;
        border: none;
        background-color: #19a5cc;
        color: #fff;
        font: inherit;
        line-height: 56px;
        text-align: center;
        white-space: nowrap;
        cursor: pointer;
        box-sizing: border-box;
        text-decoration: none;
    }

    #footer-pane .stay-chat .almamed-chat-open .material-icons {
        color: #fff;
        vertical-align: middle;
        margin-top: -0.25em;
        margin-right: 0.25em;
    }

    #footer-pane .stay-chat .almamed-chat-open span {
        border-bottom: 1px solid #fff;
    }

    #footer-pane .stay-chat .almamed-chat-open:hover {
        background-color: #1496b8;
    }

    #footer-pane:hover .stay-chat .almamed-chat-open {
        height: 64px;
        line-height: 64px;
    }

    #almamed-cookie-consent .cookie-consent__chat {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 40px;
        padding: 0 16px;
        border: none;
        border-radius: 6px;
        background: #0497C0;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        box-sizing: border-box;
    }

    #almamed-cookie-consent .cookie-consent__chat .material-icons {
        font-size: 18px;
        line-height: 1;
    }

    #almamed-cookie-consent .cookie-consent__chat:hover {
        background: #036884;
    }

    body.almamed-custom-chat .online-chat-root .online-chat-trigger,
    body.almamed-custom-chat .online-chat-root .trigger-classic,
    body.almamed-custom-chat .online-chat-root .trigger-round,
    body.almamed-custom-chat .online-chat-root .trigger-background {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
        opacity: 0 !important;
    }
}

@media only screen and (max-width: 768px) {
    #almamed-cookie-consent .cookie-consent__chat {
        width: calc(100% - 48px);
        margin-left: 48px;
    }
}
</style>

<script>
;(function(window, document) {
    'use strict';

    var DESKTOP_MIN = 993;

    function isDesktop() {
        return window.matchMedia('(min-width: ' + DESKTOP_MIN + 'px)').matches;
    }

    function openTalkMe() {
        if (typeof window.TalkMe !== 'function') {
            return;
        }
        try {
            window.TalkMe('openSupport');
            return;
        } catch (e) {}
        try {
            window.TalkMe('openChatTab');
        } catch (e2) {}
    }

    function hideNativeTrigger() {
        if (typeof window.TalkMe !== 'function') {
            return false;
        }
        try {
            window.TalkMe('hideTrigger');
            return true;
        } catch (e) {}
        return false;
    }

    function showNativeTrigger() {
        if (typeof window.TalkMe !== 'function') {
            return;
        }
        try {
            window.TalkMe('showTrigger');
        } catch (e) {}
    }

    function syncTriggerMode() {
        if (isDesktop()) {
            document.body.classList.add('almamed-custom-chat');
            hideNativeTrigger();
        } else {
            document.body.classList.remove('almamed-custom-chat');
            showNativeTrigger();
        }
    }

    document.addEventListener('click', function(e) {
        var btn = e.target.closest('.almamed-chat-open');
        if (!btn) {
            return;
        }
        e.preventDefault();
        openTalkMe();
    });

    var attempts = 0;
    var poll = window.setInterval(function() {
        attempts += 1;
        syncTriggerMode();
        if (typeof window.TalkMe === 'function' || attempts > 120) {
            window.clearInterval(poll);
        }
    }, 250);

    window.addEventListener('resize', syncTriggerMode);
    window.addEventListener('load', syncTriggerMode);
})(window, document);
</script>
{/strip}
